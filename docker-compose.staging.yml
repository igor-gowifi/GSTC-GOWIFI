version: '3.8'

services:
  app-staging:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gowifi-app-staging
    restart: unless-stopped
    ports:
      - '3001:3000' # Mapeia a porta 3001 externa para a 3000 do container
    environment:
      - NODE_ENV=development # Ou staging
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - VITE_APP_ID=${VITE_APP_ID}
      - OAUTH_SERVER_URL=${OAUTH_SERVER_URL}
      - VITE_OAUTH_PORTAL_URL=${VITE_OAUTH_PORTAL_URL}
      - FRESHDESK_DOMAIN=${FRESHDESK_DOMAIN}
      - FRESHDESK_API_KEY=${FRESHDESK_API_KEY}
      - BUILT_IN_FORGE_API_URL=${BUILT_IN_FORGE_API_URL}
      - BUILT_IN_FORGE_API_KEY=${BUILT_IN_FORGE_API_KEY}
      - VITE_APP_TITLE=${VITE_APP_TITLE} (BETA)
      - VITE_APP_LOGO=${VITE_APP_LOGO}
    networks:
      - gowifi-staging-network
    volumes:
      # Mapeamentos para desenvolvimento e hot-reload
      - .:/app
      - /app/node_modules
      - /app/.pnpm-store
      - ./database:/app/database

networks:
  gowifi-staging-network:
    driver: bridge
