services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gowifi-app-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3001
    ports:
      - '3001:3001'
    networks:
      - gowifi-network
    volumes:
      - ./database:/app/database

networks:
  gowifi-network:
    driver: bridge
